[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "commonswire"
dynamic = ["version"]
description = "A living, full-text corpus of news that may be redistributed, with each article's license and credit line"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Obada Kraishan" }]
keywords = [
    "news",
    "corpus",
    "journalism",
    "communication-research",
    "creative-commons",
    "content-analysis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Sociology",
]
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.scripts]
commonswire = "commonswire.cli:main"

[project.urls]
Repository = "https://github.com/obadaKraishan/commonswire"
Issues = "https://github.com/obadaKraishan/commonswire/issues"
Changelog = "https://github.com/obadaKraishan/commonswire/blob/main/CHANGELOG.md"

[project.optional-dependencies]
corpus = [
    "numpy>=1.26",
    "pyarrow>=16",
]

[tool.hatch.version]
path = "src/commonswire/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/commonswire"]

# The sdist carries the code, the tests and the tracked reference tables; never article text.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["commonswire"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
